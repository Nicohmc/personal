<!doctype html>
<html lang="zh-Hant">
<head>

  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#245C80;background:#FAF1E7}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);padding:clamp(28px,7vw,64px) 24px;text-align:center;border:1px solid #E6D7C6;border-radius:28px;background:#FFFDF8;box-shadow:0 20px 60px #245C8010}
    .wave{font-size:36px;margin-bottom:12px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#A57968}h1{font-size:clamp(23px,5vw,33px);font-weight:600;line-height:1.65;margin:20px 0 12px}p{line-height:1.9;color:#67828B}.en{font-family:Georgia,serif;font-style:italic;color:#B27D6D;margin-bottom:30px}
    a{display:inline-block;color:white;background:#245C80;text-decoration:none;padding:13px 28px;border-radius:999px;font-weight:600}a:hover{background:#1C4D6E}.hint{font-size:12px;margin-top:24px}
  </style>
  <script>
    // GitHub Pages is a static host. The private dashboard and Sheets sync run inside Apps Script.
    const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbyCWfet5FE7ZetyOI-eryL2m5K5xl4z6TNEh1spBCzys0MO0MgDfc390IBw38UwvQtP/exec';
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('enter').href = DASHBOARD_URL;
      // Automatically continue to the Google Apps Script hosted, sync-enabled dashboard.
      window.location.replace(DASHBOARD_URL);

    <a id="enter" href="https://script.google.com/macros/s/AKfycbyCWfet5FE7ZetyOI-eryL2m5K5xl4z6TNEh1spBCzys0MO0MgDfc390IBw38UwvQtP/exec">進入我的小海灣</a>
    <p class="hint">正在前往個人儀表板。如果沒有自動開啟，請按上方按鈕。</p>
